<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<!--PWA-->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<!--/PWA-->
<title>Training</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#F2F2F7;--card:#FFFFFF;--card2:#F2F2F7;--sheet:#F2F2F7;--scard:#FFFFFF;
  --label:#000000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29);--fill:rgba(120,120,128,.2);--fill2:rgba(120,120,128,.16);--fill3:rgba(118,118,128,.12);--hl:#D1D1D6;
  --tint:#007AFF;--tint-soft:rgba(0,122,255,.12);--on:#FFFFFF;
  --red:#FF3B30;--green:#34C759;--orange:#FF9500;--yellow:#FFCC00;--pink:#FF2D55;--purple:#AF52DE;--indigo:#5856D6;--teal:#30B0C7;--cyan:#32ADE6;--gray:#8E8E93;
  --r1a:#E8003D;--r1b:#FA114F;--r2a:#4DBB00;--r2b:#86DD0E;--r3a:#00A2C2;--r3b:#00CFE0;--rt:.2;
  --mat:rgba(250,250,252,.74);--mat-line:rgba(0,0,0,.1);--shadow:0 10px 30px rgba(0,0,0,.12);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',system-ui,'Segoe UI',Roboto,sans-serif;
  --round:ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --spring:cubic-bezier(.32,.72,0,1);--bounce:cubic-bezier(.34,1.56,.64,1);
  --rad:20px;--segsel:#FFFFFF;
  --t1:#E8003D;--t2:#3C9A00;--t3:#0093B4;
}
@supports (transition-timing-function:linear(0,1)){:root{
  --spring:linear(0,0.0307,0.1066,0.2081,0.3206,0.4339,0.5413,0.6386,0.7237,0.7957,0.8551,0.9026,0.9396,0.9675,0.9878,1.002,1.0112,1.0166,1.0193,1.0199,1.0192,1.0176,1.0156,1.0133,1.0111,1.0089,1.007,1.0054,1.0039,1.0028,1);
  --bounce:linear(0,0.0433,0.1538,0.3044,0.4721,0.6385,0.7902,0.9186,1.0194,1.0918,1.1372,1.1592,1.1622,1.1511,1.1305,1.1046,1.0771,1.0505,1.0269,1.0074,0.9925,0.9822,0.9761,0.9736,0.9739,0.9763,0.98,0.9844,0.9889,0.9931,0.9967,0.9997,1.0019,1.0033,1.0041,1.0043,1.0042,1.0037,1.003,1.0023,1);
}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--card:#1C1C1E;--card2:#2C2C2E;--sheet:#1C1C1E;--scard:#2C2C2E;
  --label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65);--fill:rgba(120,120,128,.36);--fill2:rgba(120,120,128,.32);--fill3:rgba(118,118,128,.24);--hl:#3A3A3C;
  --tint:#0A84FF;--tint-soft:rgba(10,132,255,.22);
  --red:#FF453A;--green:#30D158;--orange:#FF9F0A;--yellow:#FFD60A;--pink:#FF375F;--purple:#BF5AF2;--indigo:#5E5CE6;--teal:#40C8E0;--cyan:#64D2FF;
  --r1a:#E1003F;--r1b:#FF2A68;--r2a:#7FE000;--r2b:#B8FF2E;--r3a:#00C8F0;--r3b:#2AF5E8;--rt:.24;
  --mat:rgba(30,30,32,.72);--mat-line:rgba(255,255,255,.12);--shadow:0 10px 30px rgba(0,0,0,.5);--segsel:#636366;--t1:#FF2A68;--t2:#B8FF2E;--t3:#2AF5E8;
}}
:root[data-theme="dark"]{
  --bg:#000000;--card:#1C1C1E;--card2:#2C2C2E;--sheet:#1C1C1E;--scard:#2C2C2E;
  --label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65);--fill:rgba(120,120,128,.36);--fill2:rgba(120,120,128,.32);--fill3:rgba(118,118,128,.24);--hl:#3A3A3C;
  --tint:#0A84FF;--tint-soft:rgba(10,132,255,.22);
  --red:#FF453A;--green:#30D158;--orange:#FF9F0A;--yellow:#FFD60A;--pink:#FF375F;--purple:#BF5AF2;--indigo:#5E5CE6;--teal:#40C8E0;--cyan:#64D2FF;
  --r1a:#E1003F;--r1b:#FF2A68;--r2a:#7FE000;--r2b:#B8FF2E;--r3a:#00C8F0;--r3b:#2AF5E8;--rt:.24;
  --mat:rgba(30,30,32,.72);--mat-line:rgba(255,255,255,.12);--shadow:0 10px 30px rgba(0,0,0,.5);--segsel:#636366;--t1:#FF2A68;--t2:#B8FF2E;--t3:#2AF5E8;
}
html{height:100%;background:var(--bg);touch-action:manipulation;-webkit-text-size-adjust:100%;scroll-padding-top:60px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--label);font:17px/1.35 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
main{max-width:640px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(116px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.intrain main{padding-top:0;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
body.intrain nav.tabs,body.intrain .nav,body.notabs nav.tabs{display:none}
body.notabs main{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
main.enter{animation:enter .45s var(--spring) both}
main.push{animation:push .5s var(--spring) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes push{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
h1,h2,h3{margin:0}
h1{font:700 34px/41px var(--font);letter-spacing:.01em}
h2{font:700 22px/28px var(--font)}
h3{font:600 17px/22px var(--font)}
p{margin:0}
.muted{color:var(--label2)}
.small{font-size:15px;line-height:20px}
.num{font-family:var(--round);font-weight:600;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.35;cursor:default}
:focus{outline:none}
:focus-visible{outline:3px solid var(--tint-soft);outline-offset:2px}
.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

/* Großer Titel und kompakte Kopfzeile */
.lth{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 16px;min-height:44px}
.lt{transform-origin:0 100%;will-change:transform}
.eyebrow{font:600 13px/18px var(--font);text-transform:uppercase;letter-spacing:.02em;color:var(--label2)}
.nav{position:fixed;top:0;left:0;right:0;z-index:30;height:calc(44px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:center;pointer-events:none;background:transparent;transition:background-color .25s,box-shadow .25s}
.nav b{font:600 17px/22px var(--font);opacity:0;transform:translateY(6px);transition:opacity .2s,transform .4s var(--spring)}
.nav.on{pointer-events:auto;background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--mat-line)}
.nav.on b{opacity:1;transform:none}
.who{width:44px;height:44px;border-radius:50%;border:0;padding:0;flex:none;background:linear-gradient(180deg,#A5ABB8,#858A96);color:#fff;font:600 19px var(--round);display:grid;place-items:center}

/* Karten, Listen, Abschnitte */
.sh{margin:28px 4px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sh span{font:400 15px var(--font);color:var(--label2)}
.card{background:var(--card);border-radius:var(--rad);padding:16px;margin-bottom:12px}
.card>h2{font-size:20px;line-height:25px;margin-bottom:6px}
.ch{display:flex;align-items:center;gap:6px;font:600 15px/20px var(--font);color:var(--c,var(--tint));margin-bottom:6px}
.ch .i{width:18px;height:18px}
.ch span{margin-left:auto;color:var(--label3);font-weight:400}
.lh{display:flex;justify-content:space-between;gap:10px;font:400 13px/18px var(--font);text-transform:uppercase;letter-spacing:.02em;color:var(--label2);margin:22px 16px 7px}
.lh:first-child{margin-top:8px}
.lf{font:400 13px/18px var(--font);color:var(--label2);margin:7px 16px 0}
.list{background:var(--card);border-radius:var(--rad);overflow:hidden;margin:0 0 12px}
.list+.lf,.card+.lf{margin-top:-5px}
.sh+.lh,.lth+.lh{margin-top:0}
.lh+.seg{margin-top:0}
.seg+.lf{margin-top:8px}
.cell{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 16px;border:0;background:transparent;text-align:left;color:var(--label);font:400 17px/22px var(--font);transition:background-color .35s}
.cell:active{background:var(--hl);transition:none}
div.cell:active{background:transparent}
.cell+.cell::before{content:'';position:absolute;top:0;right:0;left:var(--sx,16px);border-top:.5px solid var(--sep)}
.list.ic .cell{--sx:58px}
.cell .ct{flex:1;min-width:0}
.cell .ct b{display:block;font-weight:400}
.cell .ct small{display:block;font-size:15px;line-height:20px;color:var(--label2);margin-top:1px}
.cell .cv{color:var(--label2);text-align:right;flex:none}
.cell .chev{width:14px;height:14px;color:var(--label3);stroke-width:2.6}
.cell .ck{color:var(--tint);stroke-width:2.6;width:20px;height:20px}
.cell.danger,.cell.danger .ct b{color:var(--red)}
.cell.tint .ct b{color:var(--tint)}
.ico{width:30px;height:30px;border-radius:8px;background:var(--c,var(--tint));color:#fff;display:grid;place-items:center;flex:none}
.ico .i{width:19px;height:19px;stroke-width:2.2}

/* iOS-Schalter */
.sw{position:relative;flex:none;width:51px;height:31px;border-radius:16px;background:var(--fill);transition:background-color .3s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .5s var(--spring)}
[aria-checked="true"]>.sw{background:var(--green)}
[aria-checked="true"]>.sw::after{transform:translateX(20px)}

/* Segmente */
.seg{position:relative;display:flex;background:var(--fill3);border-radius:999px;padding:3px;margin:14px 0 4px;isolation:isolate}
.seg>i{position:absolute;z-index:-1;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));transform:translateX(calc(100% * var(--i)));border-radius:999px;background:var(--segsel);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .5s var(--spring)}
.list .seg,.card .seg{background:var(--fill3)}
.seg button{flex:1;min-width:0;border:0;background:none;border-radius:999px;padding:6px 4px;min-height:38px;font:500 15px/20px var(--font);color:var(--label);white-space:nowrap;transition:transform .3s var(--spring)}
.seg button[aria-pressed="true"]{font-weight:600}
.seg button:active{transform:scale(.95)}
.seg.lg button{min-height:44px}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 17px/22px var(--font);border:0;border-radius:999px;padding:12px 20px;min-height:50px;transition:transform .45s var(--spring),opacity .2s,background-color .2s}
.btn .i{width:20px;height:20px}
.btn:active{transform:scale(.96);transition-duration:.12s}
.btn.big{width:100%;min-height:54px;margin-top:16px}
.primary{background:var(--tint);color:var(--on)}
.ghost{background:var(--fill3);color:var(--tint)}
.ghost.plain{color:var(--label)}
.wide{width:100%;margin-top:12px}
.link{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:10px 0;min-height:44px;font:400 17px/22px var(--font);color:var(--tint);text-align:left;transition:opacity .2s}
.link:active{opacity:.4;transition:none}
.link.danger{color:var(--red)}
.center{display:flex;justify-content:center;width:100%;margin:6px auto 0;text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.btn{flex:1}
.between{justify-content:space-between}
.btn.sm{padding:8px 4px;min-width:0;min-height:44px;font-size:16px}
.tip{font-size:13px;line-height:18px;color:var(--label2);margin-top:12px}
.note-card{display:flex;gap:12px;align-items:flex-start}
.note-card>.i{width:24px;height:24px;color:var(--c,var(--tint));margin-top:1px}
.note-card .btn{margin-top:12px}
.note-card h2{font-size:20px;line-height:25px;margin-bottom:3px}
.note-card .ct{flex:1;min-width:0}

/* Ringe wie bei Apple Fitness */
.wkr{display:flex;align-items:center;gap:18px}
.rings{width:124px;height:124px;flex:none;display:block}
.rings circle{fill:none;stroke-linecap:round}
.rings .tr{stroke-opacity:var(--rt)}
.rings .pg{transition:stroke-dashoffset 1.1s var(--spring)}
.leg{flex:1;min-width:0;display:grid;gap:6px}
.leg p{line-height:1.15}
.leg span{display:block;font:600 15px/20px var(--font);color:var(--c)}
.leg b{font:600 24px/28px var(--round);color:var(--c);font-variant-numeric:tabular-nums}
.leg b small{font-size:17px;font-weight:600;opacity:.9}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:16px;padding-top:12px;border-top:.5px solid var(--sep)}
.week div{display:flex;flex-direction:column;align-items:center;gap:5px;font:500 12px/16px var(--font);color:var(--label2)}
.week .td{color:var(--label);font-weight:700}
.week svg{width:30px;height:30px;display:block}
.week circle{fill:none;stroke-linecap:round}

/* Wochenstreifen ohne Ringe */
.strip{display:none}

/* Heute */
.hero h2{font-size:28px;line-height:34px;margin-top:2px}
.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--label2);font-size:15px;margin-top:6px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta .i{width:17px;height:17px}
.xrow{gap:12px;padding:8px 14px 8px 12px;min-height:60px}
.list .xrow{--sx:88px}
.th{width:64px;height:48px;background:var(--card2);border-radius:12px;flex:none}
.bar{display:block;height:8px;border-radius:4px;background:var(--fill3);overflow:hidden;margin-top:8px}
.bar b{display:block;height:100%;border-radius:4px;background:var(--c,var(--tint));transition:width .8s var(--spring)}
.pval{font:600 22px/28px var(--round);color:var(--label)}
.pval small{font-size:15px;color:var(--label2);font-weight:500}

/* Strichfiguren */
.fig{display:block;width:100%;height:auto}
.fig path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .gr{stroke:var(--sep);stroke-width:2}
.fig .pr{stroke:var(--label2);stroke-width:4;opacity:.35}
.fig .cb{stroke:var(--label2);stroke-width:1.6}
.fig .lf,.fig .af{stroke:var(--label);stroke-width:6}
.fig .tn{stroke:var(--label);stroke-width:9}
.fig .hd{fill:var(--label)}
.fig .ln{stroke:var(--label);stroke-width:7}
.fig .an{stroke:var(--label);stroke-width:6}
.fig .eq{stroke:var(--tint);stroke-width:4}
.fig .eqf{fill:var(--tint)}
.fig .eqr{fill:none;stroke:var(--tint);stroke-width:4}
.fig.big{max-width:320px;margin:0 auto 14px;background:var(--scard);border-radius:22px}

/* Plan */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{border:0;background:var(--fill3);color:var(--label);border-radius:14px;min-height:60px;padding:6px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 15px/20px var(--font);transition:transform .45s var(--spring),background-color .25s,color .25s}
.days button:active{transform:scale(.92);transition-duration:.12s}
.days button small{font-size:11px;line-height:13px;font-weight:500;color:var(--label2)}
.days button.g{background:var(--tint);color:#fff}
.days button.g small{color:rgba(255,255,255,.85)}
.days button.h{background:var(--tint-soft);color:var(--tint)}
.days button.h small{color:var(--tint)}
.pad{position:relative;aspect-ratio:1;width:100%;max-width:320px;margin:6px auto;border-radius:22px;background:var(--card2);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.pad::before,.pad::after{content:'';position:absolute;background:var(--sep)}
.pad::before{left:50%;top:20%;bottom:20%;width:1px}
.pad::after{top:50%;left:24%;right:24%;height:1px}
.lb{position:absolute;font:500 13px/16px var(--font);color:var(--label2);text-align:center;pointer-events:none}
.lb b{display:block;font:600 20px/24px var(--round);color:var(--label)}
.lb.t{top:10px;left:0;right:0}.lb.b{bottom:10px;left:0;right:0}
.lb.l{left:10px;top:50%;transform:translateY(-50%)}.lb.r{right:10px;top:50%;transform:translateY(-50%)}
.knob{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px var(--tint-soft),0 3px 8px rgba(0,0,0,.2);pointer-events:none;border:7px solid var(--tint)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--fill3);color:var(--label);border-radius:999px;padding:8px 16px;min-height:44px;font:500 15px/20px var(--font);transition:transform .45s var(--spring),background-color .25s,color .25s}
.chip:active{transform:scale(.94);transition-duration:.12s}
.chip[aria-pressed="true"]{background:var(--tint);color:#fff}
.cyc{display:flex;align-items:flex-end;gap:6px;height:46px;margin-top:12px}
.cyc i{flex:1;background:var(--fill);border-radius:5px}
.cyc i.on{background:var(--tint)}
.sci .cell{display:block}
.sci .cell b{font-weight:600;display:block}
.sci .cell small{display:block;color:var(--label2);font-size:15px;line-height:20px;margin-top:2px}

/* Training */
.ftop{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;margin:0 -16px 12px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--mat-line)}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--fill3);color:var(--label2);flex:none;display:grid;place-items:center;padding:0;transition:transform .45s var(--spring)}
.x:active{transform:scale(.9);transition-duration:.12s}
.x .i{width:18px;height:18px;stroke-width:2.6}
.dots{display:flex;gap:4px;flex:1;align-items:center}
.dots button{flex:1;height:22px;border:0;padding:0;background:none;min-width:6px;position:relative}
.dots button::after{content:'';position:absolute;left:0;right:0;top:8px;height:6px;border-radius:3px;background:var(--fill);transition:background-color .4s}
.dots .d::after{background:var(--green)}
.dots .c::after{background:var(--tint)}
.el{font-size:17px;color:var(--label2);flex:none;min-width:44px;text-align:right}
.stage{background:var(--card);border-radius:24px;margin-bottom:16px;padding:4px;overflow:hidden}
.stage .fig{height:min(32vh,260px)}
.fname{font:700 28px/34px var(--font);margin:0 0 4px}
.cue{color:var(--label2);font-size:15px;line-height:20px}
.note{font-size:15px;line-height:20px;color:var(--label2);margin-top:8px}
.note.up{color:var(--tint);font-weight:600}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 2px}
.setl{font:600 20px/25px var(--font)}
.pills{display:flex;gap:6px}
.pills i{width:12px;height:12px;border-radius:50%;background:var(--fill);transition:background-color .3s}
.pills i.d{background:var(--green)}
.pills i.c{background:var(--tint);box-shadow:0 0 0 3px var(--tint-soft)}
.pills i.pop{animation:pop .6s var(--bounce)}
@keyframes pop{0%{transform:scale(.3)}100%{transform:none}}

function trend(B){const t=x=>new Date(x.d+'T12:00:00').getTime()/DAY,end=t(B[B.length-1]),Q=B.filter(x=>end-t(x)<=42).map(x=>[t(x),x.kg]);

function nextIdx(s){const n=s.items.length;for(let k=1;k<=n;k++){const i=(s.idx+k)%n,q=s.items[i];if(!q.skip&&q.sets.some(x=>!x.done))return i}return-1}

  if(!(it.step>0)||!(st.w>0))return;const nx=it.sets.find(x=>!x.done);if(!nx)return;

}

function importText(txt){
  let o;try{o=JSON.parse(String(txt||'').trim())}catch(e){toast('Das ist kein gültiges Backup.');return}
  const d=o&&o.data?o.data:o;if(!d||(!Array.isArray(d.history)&&!Array.isArray(d.plans))){toast('Das ist kein gültiges Backup.');return}
  try{localStorage.setItem(KEY+'-vorher',JSON.stringify(S))}catch(e){}
  hideRest();closeSheet();S=normalize(d);if(!S.plan||S.plan.ver!==3)genPlan();save();pasteOpen=false;backupText=null;render();toast(`Backup geladen: ${S.history.length} Trainings`);
}

/* Bedienung */
const ARM=['discard','delhist','bwdel','pdel','tmleave','reset'];
function padMove(ev){const p=document.getElementById('pad');if(!p)return;const r=p.getBoundingClientRect();const x=Math.max(-1,Math.min(1,(ev.clientX-r.left)/r.width*2-1)),y=Math.max(-1,Math.min(1,(ev.clientY-r.top)/r.height*2-1));
  S.setup.pad={x:r2(x),y:r2(y)};const k=document.getElementById('knob');k.style.left=(x+1)*50+'%';k.style.top=(y+1)*50+'%';padLabels()}
document.addEventListener('pointerdown',ev=>{const p=ev.target.closest('#pad');if(!p)return;dragging=true;try{p.setPointerCapture(ev.pointerId)}catch(e){}padMove(ev)});
document.addEventListener('pointermove',ev=>{if(dragging)padMove(ev)});
const padEnd=()=>{if(!dragging)return;dragging=false;genPlan();render()};
document.addEventListener('pointerup',padEnd);document.addEventListener('pointercancel',padEnd);
document.addEventListener('touchstart',()=>{},{passive:true});
document.addEventListener('click',ev=>{
  unlockAudio();
  const tb=ev.target.closest('[data-tab]');if(tb){armed=null;const same=tab===tb.dataset.tab;tab=tb.dataset.tab;window.scrollTo(0,0);render(same?null:'enter');return}
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  const sg=b.parentElement&&b.parentElement.classList.contains('seg')?b.parentElement:null,sw=b.getAttribute('role')==='switch';
  if((sg||sw)&&!REDUCE.matches){
    if(sg){if(b.getAttribute('aria-pressed')==='true')return;const bs=[...sg.querySelectorAll('button')];sg.style.setProperty('--i',bs.indexOf(b));bs.forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}
    else b.setAttribute('aria-checked',String(b.getAttribute('aria-checked')!=='true'));
    if(b.dataset.busy)return;b.dataset.busy=1;setTimeout(()=>act(b),230);return}
  act(b);
});
function act(b){
  const a=b.dataset.act,v=b.dataset.v,id=b.dataset.id,wd=b.dataset.wd,s=S.session,was=armed;if(!ARM.includes(a))armed=null;
  switch(a){
    case'day':{touch();const d=+b.dataset.d,c=S.setup.days[d];if(!c)S.setup.days[d]='g';else if(c==='g')S.setup.days[d]='h';else delete S.setup.days[d];genPlan();render();break}
    case'ss':touch();S.setup.ss=v==='1';genPlan();render();break;
    case'prot':{const d=ymd(Date.now());S.nut=S.nut||{};S.nut[d]=Math.max(0,(S.nut[d]||0)+(+v));const lim=ymd(Date.now()-60*DAY);for(const k in S.nut)if(k<lim)delete S.nut[k];save();kick();render();break}
    case'meas':{const en={d:ymd(Date.now())};let ok=false;document.querySelectorAll('[data-ms]').forEach(i=>{const x=num(i.value);if(x>=20&&x<=250){en[i.dataset.ms]=r2(x);ok=true}});if(!ok){toast('Trag mindestens ein Maß in cm ein');break}S.meas=(S.meas||[]).filter(m=>m.d!==en.d).concat(en);save();kick();render();toast('Maße gespeichert');break}
    case'fbcfgtoggle':CFGOPEN=!CFGOPEN;render();break;
    case'fbcfg':{const k=(document.getElementById('fbK').value||'').trim(),p=(document.getElementById('fbI').value||'').trim();if(k&&p){try{localStorage.setItem('training-fb',JSON.stringify({apiKey:k,projectId:p}))}catch(e){}render();toast('Gespeichert')}break}
    case'fblogin':case'fbsignup':{const em=(document.getElementById('fbE').value||'').trim(),pw=document.getElementById('fbP').value||'';if(!em||!pw){toast('E-Mail und Passwort eintragen');break}
      fbAuth(a==='fbsignup'?'signUp':'signInWithPassword',em,pw).then(()=>{toast('Angemeldet');render();sync()},er=>toast(fbErr(er)));break}
    case'fbreset':{const em=(document.getElementById('fbE').value||'').trim();if(!em){toast('Trag zuerst deine E-Mail ein');break}fetch(`https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key=${FB().apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requestType:'PASSWORD_RESET',email:em})}).then(r=>toast(r.ok?'E-Mail zum Zurücksetzen ist unterwegs':'Das hat nicht geklappt'),()=>toast('Keine Verbindung'));break}
    case'fblogout':S.cloud=null;TOK=null;TEAM=null;save();render();break;
    case'fbsync':sync();setTimeout(render,50);break;
    case'tmnew':teamJoin(newCode());break;
    case'tmjoin':{const t=((document.getElementById('tmC')||{}).value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(t.length!==8){toast('Der Code hat 8 Zeichen');break}teamJoin(t);break}
    case'tmshare':{const txt=`Mach mit in meinem Trainings-Team! Code: ${S.cloud.team}`;if(navigator.share)navigator.share({text:txt}).catch(()=>{});else{try{navigator.clipboard.writeText(txt)}catch(e){}toast('Code kopiert')}break}
    case'tmleave':if(was==='tmleave'){armed=null;teamLeave()}else{armed='tmleave';render()}break;
    case'mach':touch();S.setup.mach=v==='1';genPlan();render();break;
    case'rateok':case'ratealt':{const id0=s&&s.rate;if(id0){if(a==='rateok'){S.setup.ok=S.setup.ok||{};S.setup.ok[id0]=1}else{S.setup.ban=S.setup.ban||[];if(!S.setup.ban.includes(id0))S.setup.ban.push(id0);toast('Kommt nicht mehr dran. Die App nimmt eine andere Übung für dieselben Muskeln.')}s.rate=null;touch();genPlan();save()}
      if(document.getElementById('rest').classList.contains('show'))showRest();else if(document.getElementById('sheet').classList.contains('show'))openFinish();break}
    case'unban':touch();S.setup.ban=(S.setup.ban||[]).filter(x=>x!==id);genPlan();render();break;
    case'reset':if(was==='reset'){armed=null;hideRest();closeSheet();S.session=null;S.del=[...new Set([...(S.del||[]),...S.history.map(h=>h.id)])];S.history=[];S.body=[];S.meas=[];S.nut={};S.meso={start:monday(Date.now()).getTime()};S.resetAt=Date.now();S.lastBackup=null;sleep();genPlan();kick();render();window.scrollTo(0,0);toast('Fortschritt zurückgesetzt')}else{armed='reset';render()}break;
    case'split':touch();S.setup.split=v;genPlan();render();break;
    case'goal':touch();S.setup.goal=v;S.setup.pad=Object.assign({},GOALPAD[v]);genPlan();render();break;
    case'focus':{touch();const f=S.setup.focus=S.setup.focus||[],q=f.indexOf(v);q<0?f.push(v):f.splice(q,1);genPlan();render();break}
    case'profiles':profSheet();break;
    case'pswitch':if(id!==PR.active){hideRest();TOK=null;TEAM=null;TEAMAT=0;PR.active=id;savePR();S=loadProfile(id);ovWd=ovPl=backupText=null;pasteOpen=false;if(!S.onb&&(!S.plan||S.plan.ver!==6))genPlan();if(S.session){wake();if(S.session.rest)showRest()}closeSheet();tab='heute';window.scrollTo(0,0);render('enter');toast(`Hallo ${me().name}`)}else closeSheet();break;
    case'pnew':{const pid='p'+uid();PR.list.push({id:pid,name:'Neues Profil'});PR.active=pid;savePR();S=defaults();S.onb=true;OB=obDefaults();save();hideRest();closeSheet();tab='heute';render();window.scrollTo(0,0);break}
    case'prename':{const t=document.getElementById('prn'),nm=t&&t.value.trim();if(nm){me().name=nm.slice(0,24);savePR();profSheet();render();toast('Umbenannt')}break}
    case'pdel':if(was==='pdel'&&PR.list.length>1){const old=PR.active;try{localStorage.removeItem(dkey(old))}catch(e){}PR.list=PR.list.filter(p=>p.id!==old);PR.active=PR.list[0].id;savePR();S=loadProfile(PR.active);armed=null;hideRest();closeSheet();if(!S.plan||S.plan.ver!==6)genPlan();render();toast('Profil gelöscht')}else{armed='pdel';profSheet()}break;
    case'obg':OB.goal=v;render();break;
    case'obf':{const q=OB.focus.indexOf(v);q<0?OB.focus.push(v):OB.focus.splice(q,1);render();break}
    case'obl':OB.lvl=+v;render();break;
    case'obp':OB.pl=v;render();break;
    case'obn':OB.n=+v;render();break;
    case'obgo':{if(OB.name.trim()){me().name=OB.name.trim().slice(0,24);savePR()}
      const D={2:[0,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,4,5]}[OB.n];
      S.setup=Object.assign(defaults().setup,{days:Object.fromEntries(D.map(d=>[d,OB.pl])),lvl:OB.lvl,goal:OB.goal,focus:OB.focus.slice(),pad:Object.assign({},GOALPAD[OB.goal])});
      const b=num(OB.bw);if(b>=30&&b<=250)S.body=[{d:ymd(Date.now()),kg:r2(b)}];
      delete S.onb;genPlan();tab='heute';window.scrollTo(0,0);render('enter');toast('Dein Plan steht.');break}
    case'obcancel':{const old=PR.active;try{localStorage.removeItem(dkey(old))}catch(e){}PR.list=PR.list.filter(p=>p.id!==old);PR.active=PR.list[0].id;savePR();S=loadProfile(PR.active);if(!S.plan||S.plan.ver!==6)genPlan();render();break}
    case'firstok':{const it=s.items[s.idx];if(!(it.w>0)){toast('Trag zuerst ein Gewicht ein.');break}it.first=false;it.sets.forEach(x=>{if(!x.done)x.w=it.w});save();render();break}
    case'dur':touch();S.setup.dur=v==='auto'?'auto':+v;genPlan();render();break;
    case'lvl':touch();S.setup.lvl=+v;genPlan();render();break;
    case'place':ovPl=v;render();break;
    case'anyway':ovWd=+wd;render();break;
    case'start':startSession(+wd,b.dataset.pl);break;
    case'info':infoSheet(id,+wd,b.dataset.pl,b.dataset.ctx);break;
    case'swaplist':swapSheet(id,wd==null?null:+wd,b.dataset.pl,b.dataset.ctx);break;
    case'doswap':{const to=b.dataset.to;if(b.dataset.ctx!=='s')touch();
      if(b.dataset.ctx==='s'){const i=s.items.findIndex(x=>x.id===id);if(i>=0){s.items[i]=mkItem({id:to,sets:EXM[to].sets},s.pl);s.idx=i;save()}}
      else{const d=S.plan.days[wd],it=d&&d.items.find(x=>x.id===id);if(it){S.swaps[wd+':'+(it.o||it.id)]=to;genPlan()}}
      closeSheet();render();toast('Getauscht');break}
    case'remove':{touch();const d=S.plan.days[wd],it=d&&d.items.find(x=>x.id===id);if(it){S.swaps[wd+':'+(it.o||it.id)]='-';genPlan()}closeSheet();render();break}
    case'sheetclose':closeSheet();break;
    case'setdone':completeSet();break;
    case'vadj':{const it=s.items[s.idx],st=it.sets.find(x=>!x.done);if(!st)break;const d=it.t==='t'?(st.v>=300?60:5):1;st.v=Math.max(it.t==='t'?5:0,st.v+(+v)*d);save();render();break}
    case'wadj':{const it=s.items[s.idx];it.w=r2(Math.max(0,it.w+(+v)*(it.step||2.5)));save();render();break}
    case'tgo':{const st=s.items[s.idx].sets.find(x=>!x.done);if(st){s.run={i:s.idx,endAt:Date.now()+st.v*1000,total:st.v};save();render()}break}
    case'tstop':if(s.run){const el=Math.max(1,Math.round(s.run.total-(s.run.endAt-Date.now())/1000));completeSet(Math.min(el,s.run.total))}break;
    case'skip':{s.items[s.idx].skip=true;s.run=null;const nx=nextIdx(s);if(nx<0){save();openFinish()}else{s.idx=nx;save();render()}break}
    case'jump':s.idx=+b.dataset.i;s.run=null;save();render();break;
    case'end':openFinish();break;
    case'finish':{const ok=finalize(false);kick();tab='heute';window.scrollTo(0,0);render('enter');toast(ok?'Gespeichert, stark gemacht!':'Training beendet.');break}
    case'discard':if(was==='discard'){armed=null;hideRest();closeSheet();S.session=null;save();sleep();render()}else{armed='discard';openFinish()}break;
    case'radj':{const r=s&&s.rest;if(r){r.endAt=(+v>0?Math.max(r.endAt,Date.now()):r.endAt)+(+v)*1000;r.total=Math.max(r.total,(r.endAt-Date.now())/1000);r.fired=false;save();document.getElementById('rest').classList.remove('go');const t=document.getElementById('rtitle');if(t)t.textContent='Pause';tick()}break}
    case'rskip':hideRest();break;
    case'bw':{const inp=document.getElementById('bw'),x=num(inp&&inp.value);if(x<30||x>300){toast('Trag dein Gewicht in kg ein, z. B. 68,5');break}const d=ymd(Date.now());S.body=S.body.filter(q=>q.d!==d);S.body.push({d,kg:r2(x)});save();kick();render();toast('Eingetragen');break}
    case'bwdel':if(was==='bwdel'){const B=[...S.body].sort((p,q)=>p.d<q.d?-1:1),l=B[B.length-1];S.body=S.body.filter(q=>q!==l);armed=null;save()}else armed='bwdel';render();break;
    case'htoggle':openHist.has(id)?openHist.delete(id):openHist.add(id);render();break;
    case'delhist':if(was==='h'+id){(S.del=S.del||[]).push(id);S.history=S.history.filter(h=>h.id!==id);armed=null;save();kick()}else armed='h'+id;render();break;
    case'showall':showAll=!showAll;render();break;
    case'backup':exportBackup();break;
    case'restore':{const f=document.getElementById('file');if(f)f.click();break}
    case'copybt':{const t=document.getElementById('bt');if(!t)break;t.focus();t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(backupText).then(()=>toast('Kopiert'),()=>toast(ok?'Kopiert':'Text ist markiert, jetzt kopieren'));else toast(ok?'Kopiert':'Text ist markiert, jetzt kopieren');break}
    case'pastetoggle':pasteOpen=!pasteOpen;render();break;
    case'pasteload':{const t=document.getElementById('pt');importText(t&&t.value);break}
  }
}
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.dataset.ob){OB[t.dataset.ob]=t.value;return}
  if(t.dataset.w&&S.session){S.session.items[S.session.idx].w=r2(Math.max(0,num(t.value)));save()}
  else if(t.dataset.set==='goalKg'){S.settings.goalKg=r2(Math.max(0,num(t.value)));save()}});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='file'&&t.files&&t.files[0]){const f=t.files[0];t.value='';f.text().then(importText,()=>toast('Die Datei ließ sich nicht lesen.'))}});
document.addEventListener('keydown',ev=>{if(ev.key!=='Enter')return;const t=ev.target;if(t.id==='bw'){ev.preventDefault();const b=document.querySelector('[data-act="bw"]');if(b)b.click()}else if(t.dataset&&t.dataset.w)t.blur()});
document.addEventListener('focusin',ev=>{if(ev.target.id==='bt')ev.target.select()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const had=!!S.session;checkStale();if(!S.session&&!S.onb&&S.plan&&S.plan.wk!==ymd(monday(Date.now()))){genPlan();render()}else if(had&&!S.session)render();wake();tick();if(S.cloud&&Date.now()-(S.cloud.last||0)>120000)sync()}});

/* Start */
if(!S.plan||S.plan.ver!==6||S.plan.wk!==ymd(monday(Date.now())))genPlan();
setTimeout(()=>sync(),1500);
checkStale();
if(S.session){wake();if(S.session.rest&&S.session.rest.endAt>Date.now()-4000)showRest();else if(S.session.rest){S.session.rest=null;save()}}
render();
setInterval(tick,250);
if('serviceWorker'in navigator&&!PREVIEW&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
