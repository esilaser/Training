:root{
  --bg:#EEF0EC;--surface:#FFFFFF;--ink:#1C2126;--muted:#5E6873;--line:#D6DAD4;
  --blue:#1F4E8C;--blue-ink:#FFFFFF;--blue-soft:#DCE6F3;--red:#C8332B;--soft:#E4E8EC;
  --cond:'BC','Arial Narrow',sans-serif;
  --body:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17191C;--surface:#22262B;--ink:#ECEFEA;--muted:#9AA3AD;--line:#343A41;
    --blue:#6A9BE0;--blue-ink:#0E1826;--blue-soft:#243448;--red:#E3594F;--soft:#2C323A;
  }
}
:root[data-theme="dark"]{
  --bg:#17191C;--surface:#22262B;--ink:#ECEFEA;--muted:#9AA3AD;--line:#343A41;
  --blue:#6A9BE0;--blue-ink:#0E1826;--blue-soft:#243448;--red:#E3594F;--soft:#2C323A;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);touch-action:manipulation}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 18px calc(104px + env(safe-area-inset-bottom,0px))}
body.intrain main{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
body.intrain nav.tabs{display:none}
h1{font:700 44px/1 var(--cond);margin:12px 0 16px}
h2{font:700 26px/1.1 var(--cond);margin:0 0 8px}
h3{font:700 24px/1.1 var(--cond);margin:0 0 6px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:15px}
.num{font-family:var(--cond);font-weight:600;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{font-family:var(--body);font-weight:600;font-size:16px;border:0;border-radius:12px;padding:12px 18px;min-height:48px}
.btn.big{min-height:58px;font-size:18px;width:100%;margin-top:14px}
.primary{background:var(--blue);color:var(--blue-ink)}
.ghost{background:var(--soft);color:var(--ink)}
.wide{width:100%;margin-top:10px}
.link{background:none;border:0;padding:10px 0;font-weight:600;font-size:16px;color:var(--blue);min-height:44px;text-align:left}
.link.danger{color:var(--red)}
.center{display:block;margin:10px auto 0;text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.btn{flex:1}
.between{justify-content:space-between}
.card{background:var(--surface);border-radius:16px;padding:18px;margin-bottom:14px}
.notice{background:var(--blue-soft);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.notice .btn{margin-top:12px}
.tip{font-size:15px;color:var(--muted);margin-top:12px}
.sec{margin:24px 0 10px}

.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 18px}
.strip div{text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.strip i{display:grid;place-items:center;height:34px;border-radius:9px;margin-top:4px;border:2px solid transparent;background:var(--soft);color:var(--blue-ink)}
.strip .pl i{border-color:var(--blue);background:transparent}
.strip .dn i{background:var(--blue);border-color:var(--blue)}
.strip .td{color:var(--ink)}
.strip .td i{box-shadow:0 0 0 3px var(--blue-soft)}

.today{background:var(--surface);border-radius:16px;padding:18px 18px 18px 22px;border-left:8px solid var(--blue);margin-bottom:18px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;margin:14px 0 6px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:10px;font-weight:600;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.xrow{display:grid;grid-template-columns:66px 1fr;gap:12px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:8px 0;text-align:left}
.xrow:first-child{border-top:0}
.xrow b{display:block;font-weight:600;line-height:1.25}
.xrow small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.th{width:66px;height:50px;background:var(--bg);border-radius:10px}

.fig{display:block;width:100%;height:auto}
.fig path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .gr{stroke:var(--line);stroke-width:2}
.fig .pr{stroke:var(--muted);stroke-width:4;opacity:.35}
.fig .cb{stroke:var(--muted);stroke-width:1.6}
.fig .lf,.fig .af{stroke:var(--muted);stroke-width:6.5;opacity:.45}
.fig .tn{stroke:var(--ink);stroke-width:9}
.fig .hd{fill:var(--ink)}
.fig .ln{stroke:var(--ink);stroke-width:7}
.fig .an{stroke:var(--ink);stroke-width:6}
.fig .eq{stroke:var(--blue);stroke-width:4}
.fig .eqf{fill:var(--blue)}
.fig .eqr{fill:none;stroke:var(--blue);stroke-width:4}
.fig.big{max-width:340px;margin:0 auto 10px;background:var(--bg);border-radius:16px}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.days button{border:2px solid var(--line);background:var(--surface);border-radius:12px;min-height:62px;padding:6px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:15px}
.days button small{font-size:11px;font-weight:600;color:var(--muted)}
.days button.g{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.days button.g small{color:var(--blue-ink)}
.days button.h{border-color:var(--blue);color:var(--blue)}
.days button.h small{color:var(--blue)}
.pad{position:relative;aspect-ratio:1;width:100%;max-width:330px;margin:14px auto 4px;border-radius:18px;background:var(--bg);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.pad::before,.pad::after{content:'';position:absolute;background:var(--line)}
.pad::before{left:50%;top:18%;bottom:18%;width:2px}
.pad::after{top:50%;left:22%;right:22%;height:2px}
.lb{position:absolute;font-size:13px;font-weight:600;color:var(--muted);text-align:center;line-height:1.15;pointer-events:none}
.lb b{display:block;font:700 22px var(--cond);color:var(--ink)}
.lb.t{top:10px;left:0;right:0}.lb.b{bottom:10px;left:0;right:0}
.lb.l{left:10px;top:50%;transform:translateY(-50%)}.lb.r{right:10px;top:50%;transform:translateY(-50%)}
.knob{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 7px var(--blue-soft);pointer-events:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;min-height:44px;font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.wk{background:var(--surface);border-radius:16px;padding:14px 18px 8px;margin-bottom:12px}
.wk .hd2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}

.ftop{display:flex;align-items:center;gap:12px;margin:6px 0 12px}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);font-size:26px;line-height:1;flex:none;display:grid;place-items:center;padding:0}
.dots{display:flex;gap:4px;flex:1}
.dots button{flex:1;height:8px;border-radius:4px;border:0;padding:0;background:var(--line);min-width:6px}
.dots .d{background:var(--blue)}
.dots .c{background:var(--ink)}
.el{font-size:20px;color:var(--muted);flex:none}
.stage{background:var(--surface);border-radius:20px;margin-bottom:14px;padding:4px}
.fname{font-size:36px;margin:0 0 6px}
.cue{color:var(--muted);font-size:15px}
.note{font-size:15px;color:var(--muted);margin-top:6px}
.note.up{color:var(--blue);font-weight:600}
.setl{font-weight:600;font-size:18px;margin:12px 0 2px}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) 50px 100px 50px;gap:8px;align-items:center;margin-top:10px}
.ctl>span:first-child{font-weight:600;font-size:16px}
.stage .fig{height:min(34vh,270px)}
.rv{font:700 36px var(--cond);text-align:center;font-variant-numeric:tabular-nums}
.wbox{position:relative}
.wval{width:100%;height:50px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center;font:700 26px var(--cond);padding:0 24px 0 4px;-webkit-appearance:none;appearance:none}
.wu{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--muted);pointer-events:none}
.step{width:50px;height:50px;border-radius:50%;border:0;background:var(--soft);font:500 26px/1 var(--body);display:grid;place-items:center;padding:0}
.adj{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:4px}
.huge{width:100%;min-height:66px;font-size:19px;margin-top:18px;border-radius:16px}
.dial{position:relative;width:min(220px,60vw);aspect-ratio:1;margin:8px auto 0}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .val{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(48px,15vw,68px) var(--cond);font-variant-numeric:tabular-nums}
.track{stroke:var(--line)}
.prog{stroke:var(--blue);transition:stroke .2s}
.ending .prog{stroke:var(--red)}

.rover{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.rover.show{opacity:1;visibility:visible;transition:opacity .2s}
.rin{width:100%;max-width:420px;text-align:center}
.rl{font:700 34px var(--cond);margin-bottom:6px}
.rn{color:var(--muted);margin:10px 0 24px}
.rover .dial{width:min(270px,72vw)}
.rover .dial .val{font-size:clamp(64px,20vw,88px)}
.rover .btn{white-space:nowrap}
.rover.go{background:var(--blue);color:var(--blue-ink)}
.rover.go .rn{color:var(--blue-ink)}
.rover.go .track{stroke:rgba(255,255,255,.3)}
.rover.go .prog{stroke:var(--blue-ink)}
.rover.go .ghost{background:rgba(255,255,255,.2);color:var(--blue-ink)}
.rover.go .primary{background:var(--blue-ink);color:var(--blue)}
.scrim{position:fixed;inset:0;z-index:38;background:rgba(0,0,0,.35);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.scrim.show{opacity:1;visibility:visible;transition:opacity .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.2);padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;transform:translateY(110%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.sheet.show{transform:none;visibility:visible;transition:transform .25s ease}
.sin{max-width:560px;margin:0 auto}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:15px;font-weight:500;z-index:50;width:max-content;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;visibility:hidden;transition:transform .25s,opacity .25s,visibility 0s .25s}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .25s,opacity .25s}

.bignum{font:700 42px/1 var(--cond);margin:6px 0}
.spark{display:block;width:100%;height:auto;margin-top:12px;overflow:visible}
.inrow{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}
.field{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:500 17px var(--body);min-height:48px;-webkit-appearance:none;appearance:none}
.field.num{font:600 24px var(--cond);text-align:center;padding:8px 4px}
.field.sm{width:88px;min-height:42px;font-size:21px;padding:4px}
.goal{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--muted);font-size:15px}
.lifts{list-style:none;margin:0;padding:0}
.lifts li{display:grid;grid-template-columns:1fr 104px;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.lifts li:first-child{border-top:0}
.lifts b{display:block;font-weight:600}
.lifts .spark{margin:0}
.hrow{padding:10px 0;border-top:1px solid var(--line)}
.hrow:first-of-type{border-top:0}
.ta{min-height:110px;font:16px/1.4 ui-monospace,Menlo,monospace;margin:10px 0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;font-size:13px;font-weight:600}
nav.tabs button[aria-current="page"]{color:var(--blue)}
.vb{margin:12px 0}.vb i{display:block;height:8px;border-radius:4px;background:var(--soft);margin-top:5px;overflow:hidden}.vb b{display:block;height:100%;background:var(--blue);border-radius:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}.tiles div{background:var(--bg);border-radius:12px;padding:10px 12px}.tiles b{display:block;font:700 30px/1.1 var(--cond)}.tiles span{font-size:14px;color:var(--muted)}
.bars{display:block;width:100%;height:auto;margin-top:6px}
.sci{margin:8px 0 0;padding-left:18px}.sci li{margin:8px 0;font-size:15px;color:var(--muted)}.sci b{color:var(--ink)}
.first{background:var(--blue-soft);border-radius:16px;padding:14px 16px;margin-top:12px}
.badge{display:inline-block;background:var(--blue);color:var(--blue-ink);font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
@media (prefers-reduced-motion:reduce){.sheet,.prog,.toast,.rover,.scrim{transition:none}}
</style>

function trend(B){const t=x=>new Date(x.d+'T12:00:00').getTime()/DAY,end=t(B[B.length-1]),Q=B.filter(x=>end-t(x)<=42).map(x=>[t(x),x.kg]);
  if(Q.length<2||Q[Q.length-1][0]-Q[0][0]<6)return null;const mx=Q.reduce((a,p)=>a+p[0],0)/Q.length,my=Q.reduce((a,p)=>a+p[1],0)/Q.length;let a=0,b=0;Q.forEach(([x,y])=>{a+=(x-mx)*(y-my);b+=(x-mx)**2});return b?r2(a/b*7):null}

function startSession(wd,pl){
  const d=S.plan.days[wd];if(!d)return;const now=Date.now();
  S.session={start:now,lastAt:now,wd,pl,title:d.title,planned:dayMin(dayItems(wd,pl)),idx:0,items:dayItems(wd,pl).map(it=>mkItem(it,pl)),rest:null,run:null};
  ovWd=null;ovPl=null;save();persist();wake();render();window.scrollTo(0,0);
}
function nextIdx(s){const n=s.items.length;for(let k=1;k<=n;k++){const i=(s.idx+k)%n,q=s.items[i];if(!q.skip&&q.sets.some(x=>!x.done))return i}return-1}
function autoAdjust(it,st){
  if(!(it.step>0)||!(st.w>0))return;const nx=it.sets.find(x=>!x.done);if(!nx)return;
  const b=e1(st.w,st.v),raw=b/(1+((nx.p||nx.v)+2)/30);
  if(st.v>=(st.p||st.v)+4){const w2=Math.round(raw/it.step)*it.step;if(w2>it.w){it.w=w2;it.sets.forEach(x=>{if(!x.done)x.w=w2});toast(`Das war zu leicht. Nächster Satz mit ${kg(w2)} kg.`)}}
  else if(st.v<=(st.p||st.v)-3&&st.v>0){const w2=Math.max(it.step,Math.floor(raw/it.step)*it.step);if(w2<it.w){it.w=w2;it.sets.forEach(x=>{if(!x.done)x.w=w2});toast(`Etwas zu schwer. Nächster Satz mit ${kg(w2)} kg.`)}}
}
function completeSet(val){
  const s=S.session,it=s.items[s.idx],j=it.sets.findIndex(x=>!x.done);if(j<0)return;
  const st=it.sets[j];if(val!=null)st.v=val;st.w=it.w;st.done=true;s.run=null;s.lastAt=Date.now();autoAdjust(it,st);
  let rest=it.rest;
  if(!it.sets.some(x=>!x.done)){const nx=nextIdx(s);if(nx<0){save();render();openFinish();return}s.idx=nx;if(it.id==='warm')rest=0}
  save();render();window.scrollTo(0,0);if(rest>0)startRest(rest);
}
function startRest(sec){S.session.rest={endAt:Date.now()+sec*1000,total:sec,fired:false};save();showRest()}
function showRest(){
  const s=S.session,it=s.items[s.idx],j=it.sets.findIndex(x=>!x.done),el=document.getElementById('rest');
  el.innerHTML=`<div class="rin"><p class="rl" id="rtitle">Pause</p><div class="dial" id="rdial">${ring('rprog',6)}<div class="val" id="rnum">${fmt((s.rest.endAt-Date.now())/1000)}</div></div><p class="rn">Als Nächstes: ${esc(it.name)}${j>=0?`, Satz ${j+1}`:''}</p><div class="row"><button class="btn ghost" data-act="radj" data-v="-15" aria-label="15 Sekunden weniger">−15 s</button><button class="btn ghost" data-act="radj" data-v="15" aria-label="15 Sekunden mehr">+15 s</button><button class="btn primary" data-act="rskip">Weiter</button></div></div>`;
  el.classList.remove('go');el.classList.add('show');tick();
}
function hideRest(){if(S.session&&S.session.rest){S.session.rest=null;save()}document.getElementById('rest').classList.remove('show','go')}
function openFinish(){
  const s=S.session;let total=0,done=0,vol=0;s.items.forEach(it=>{if(it.id==='warm')return;it.sets.forEach(x=>{total++;if(x.done){done++;if(it.t==='r')vol+=x.v*x.w}})});
  const all=done===total,min=Math.max(1,Math.round((Date.now()-s.start)/60000));
  openSheet(done?`<h3>${all?'Geschafft!':'Training beenden?'}</h3><p class="muted">${done} von ${total} Sätzen, ${min} min${vol?`, ${kg(Math.round(vol))} kg bewegt`:''}.</p><button class="btn primary big" data-act="finish">Training speichern</button><button class="link center" data-act="sheetclose">${all?'Noch was machen':'Weiter trainieren'}</button><button class="link danger center" data-act="discard">${armed==='discard'?'Nochmal tippen: verwerfen':'Training verwerfen'}</button>`
    :'<h3>Training beenden?</h3><p class="muted">Noch kein Satz erledigt, es wird nichts gespeichert.</p><button class="btn primary big" data-act="finish">Beenden</button><button class="link center" data-act="sheetclose">Weiter trainieren</button>');
}
function finalize(auto){
  const s=S.session;if(!s)return false;let total=0,done=0;
  const items=s.items.filter(it=>it.id!=='warm').map(it=>{total+=it.sets.length;const sets=it.sets.filter(x=>x.done).map(x=>({v:x.v,w:x.w}));done+=sets.length;return{id:it.id,name:it.name,t:it.t,sets}}).filter(it=>it.sets.length);
  if(items.length)S.history.push({id:uid(),start:s.start,end:auto?(s.lastAt||s.start):Date.now(),pl:s.pl,title:s.title,planned:s.planned,comp:total?done/total:1,items});
  hideRest();closeSheet();S.session=null;save();sleep();return items.length>0;
}
function checkStale(){const s=S.session;if(s&&Date.now()-(s.lastAt||s.start)>3*3600e3){const ok=finalize(true);toast(ok?'Dein letztes Training wurde automatisch gespeichert.':'Ein leeres Training wurde beendet.')}}
function setRing(el,f){if(el)el.setAttribute('stroke-dashoffset',String(C*(1-Math.max(0,Math.min(1,f)))))}
function tick(){
  const now=Date.now(),s=S.session;if(!s)return;
  const el=document.getElementById('elapsed');if(el)el.textContent=fmtLong((now-s.start)/1000);
  if(s.run){const left=(s.run.endAt-now)/1000,n=document.getElementById('tnum');if(n)n.textContent=fmt(left);setRing(document.getElementById('tprog'),left/s.run.total);
    if(left<=0){beep();completeSet(s.run.total);return}}
  if(s.rest){const r=s.rest,left=(r.endAt-now)/1000,n=document.getElementById('rnum');if(n)n.textContent=fmt(left);setRing(document.getElementById('rprog'),left/r.total);
    const d=document.getElementById('rdial');if(d)d.classList.toggle('ending',left<=3&&left>0);
    if(left<=0&&!r.fired){r.fired=true;save();beep();document.getElementById('rest').classList.add('go');const t=document.getElementById('rtitle');if(t)t.textContent='Los geht’s';const at=r.endAt;setTimeout(()=>{if(S.session&&S.session.rest&&S.session.rest.endAt===at)hideRest()},1600)}}
}

/* Backup */
function markBackup(){S.lastBackup=Date.now();save();render();toast('Backup gesichert')}
async function exportBackup(){
  const data=JSON.stringify({app:'training',v:4,exported:new Date().toISOString(),data:S}),name=`training-backup-${ymd(Date.now())}.json`;
  if(!PREVIEW){
    for(const type of['application/json','text/plain']){try{const f=new File([data],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});markBackup();return}}catch(e){if(e&&e.name==='AbortError')return}}
    try{const u=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);markBackup();return}catch(e){}
  }
  backupText=data;tab='fortschritt';render();toast('Kopiere den Text und bewahre ihn z. B. in Notizen auf.');
}
function importText(txt){
  let o;try{o=JSON.parse(String(txt||'').trim())}catch(e){toast('Das ist kein gültiges Backup.');return}
  const d=o&&o.data?o.data:o;if(!d||(!Array.isArray(d.history)&&!Array.isArray(d.plans))){toast('Das ist kein gültiges Backup.');return}
  try{localStorage.setItem(KEY+'-vorher',JSON.stringify(S))}catch(e){}
  hideRest();closeSheet();S=normalize(d);if(!S.plan||S.plan.ver!==3)genPlan();save();pasteOpen=false;backupText=null;render();toast(`Backup geladen: ${S.history.length} Trainings`);
}

/* Bedienung */
const ARM=['discard','delhist','bwdel'];
function padMove(ev){const p=document.getElementById('pad');if(!p)return;const r=p.getBoundingClientRect();const x=Math.max(-1,Math.min(1,(ev.clientX-r.left)/r.width*2-1)),y=Math.max(-1,Math.min(1,(ev.clientY-r.top)/r.height*2-1));
  S.setup.pad={x:r2(x),y:r2(y)};const k=document.getElementById('knob');k.style.left=(x+1)*50+'%';k.style.top=(y+1)*50+'%';padLabels()}
document.addEventListener('pointerdown',ev=>{const p=ev.target.closest('#pad');if(!p)return;dragging=true;try{p.setPointerCapture(ev.pointerId)}catch(e){}padMove(ev)});
document.addEventListener('pointermove',ev=>{if(dragging)padMove(ev)});
const padEnd=()=>{if(!dragging)return;dragging=false;genPlan();render()};
document.addEventListener('pointerup',padEnd);document.addEventListener('pointercancel',padEnd);
document.addEventListener('click',ev=>{
  unlockAudio();
  const tb=ev.target.closest('[data-tab]');if(tb){armed=null;tab=tb.dataset.tab;render();window.scrollTo(0,0);return}
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,v=b.dataset.v,id=b.dataset.id,wd=b.dataset.wd,s=S.session,was=armed;if(!ARM.includes(a))armed=null;
  switch(a){
    case'day':{const d=+b.dataset.d,c=S.setup.days[d];if(!c)S.setup.days[d]='g';else if(c==='g')S.setup.days[d]='h';else delete S.setup.days[d];genPlan();render();break}
    case'split':S.setup.split=v;genPlan();render();break;
    case'firstok':{const it=s.items[s.idx];if(!(it.w>0)){toast('Trag zuerst ein Gewicht ein.');break}it.first=false;it.sets.forEach(x=>{if(!x.done)x.w=it.w});save();render();break}
    case'dur':S.setup.dur=v==='auto'?'auto':+v;genPlan();render();break;
    case'lvl':S.setup.lvl=+v;genPlan();render();break;
    case'place':ovPl=v;render();break;
    case'anyway':ovWd=+wd;render();break;
    case'start':startSession(+wd,b.dataset.pl);break;
    case'info':infoSheet(id,+wd,b.dataset.pl,b.dataset.ctx);break;
    case'swaplist':swapSheet(id,wd==null?null:+wd,b.dataset.pl,b.dataset.ctx);break;
    case'doswap':{const to=b.dataset.to;
      if(b.dataset.ctx==='s'){const i=s.items.findIndex(x=>x.id===id);if(i>=0){s.items[i]=mkItem({id:to,sets:EXM[to].sets},s.pl);s.idx=i;save()}}
      else{const d=S.plan.days[wd],it=d&&d.items.find(x=>x.id===id);if(it){S.swaps[wd+':'+(it.o||it.id)]=to;genPlan()}}
      closeSheet();render();toast('Getauscht');break}
    case'remove':{const d=S.plan.days[wd],it=d&&d.items.find(x=>x.id===id);if(it){S.swaps[wd+':'+(it.o||it.id)]='-';genPlan()}closeSheet();render();break}
    case'sheetclose':closeSheet();break;
    case'setdone':completeSet();break;
    case'vadj':{const it=s.items[s.idx],st=it.sets.find(x=>!x.done);if(!st)break;const d=it.t==='t'?(st.v>=300?60:5):1;st.v=Math.max(it.t==='t'?5:0,st.v+(+v)*d);save();render();break}
    case'wadj':{const it=s.items[s.idx];it.w=r2(Math.max(0,it.w+(+v)*(it.step||2.5)));save();render();break}
    case'tgo':{const st=s.items[s.idx].sets.find(x=>!x.done);if(st){s.run={i:s.idx,endAt:Date.now()+st.v*1000,total:st.v};save();render()}break}
    case'tstop':if(s.run){const el=Math.max(1,Math.round(s.run.total-(s.run.endAt-Date.now())/1000));completeSet(Math.min(el,s.run.total))}break;
    case'skip':{s.items[s.idx].skip=true;s.run=null;const nx=nextIdx(s);if(nx<0){save();openFinish()}else{s.idx=nx;save();render()}break}
    case'jump':s.idx=+b.dataset.i;s.run=null;save();render();break;
    case'end':openFinish();break;
    case'finish':{const ok=finalize(false);tab='heute';render();window.scrollTo(0,0);toast(ok?'Gespeichert, stark gemacht!':'Training beendet.');break}
    case'discard':if(was==='discard'){armed=null;hideRest();closeSheet();S.session=null;save();sleep();render()}else{armed='discard';openFinish()}break;
    case'radj':{const r=s&&s.rest;if(r){r.endAt=(+v>0?Math.max(r.endAt,Date.now()):r.endAt)+(+v)*1000;r.total=Math.max(r.total,(r.endAt-Date.now())/1000);r.fired=false;save();document.getElementById('rest').classList.remove('go');const t=document.getElementById('rtitle');if(t)t.textContent='Pause';tick()}break}
    case'rskip':hideRest();break;
    case'bw':{const inp=document.getElementById('bw'),x=num(inp&&inp.value);if(x<30||x>300){toast('Trag dein Gewicht in kg ein, z. B. 68,5');break}const d=ymd(Date.now());S.body=S.body.filter(q=>q.d!==d);S.body.push({d,kg:r2(x)});save();render();toast('Eingetragen');break}
    case'bwdel':if(was==='bwdel'){const B=[...S.body].sort((p,q)=>p.d<q.d?-1:1),l=B[B.length-1];S.body=S.body.filter(q=>q!==l);armed=null;save()}else armed='bwdel';render();break;
    case'htoggle':openHist.has(id)?openHist.delete(id):openHist.add(id);render();break;
    case'delhist':if(was==='h'+id){S.history=S.history.filter(h=>h.id!==id);armed=null;save()}else armed='h'+id;render();break;
    case'showall':showAll=!showAll;render();break;
    case'backup':exportBackup();break;
    case'restore':{const f=document.getElementById('file');if(f)f.click();break}
    case'copybt':{const t=document.getElementById('bt');if(!t)break;t.focus();t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(backupText).then(()=>toast('Kopiert'),()=>toast(ok?'Kopiert':'Text ist markiert, jetzt kopieren'));else toast(ok?'Kopiert':'Text ist markiert, jetzt kopieren');break}
    case'pastetoggle':pasteOpen=!pasteOpen;render();break;
    case'pasteload':{const t=document.getElementById('pt');importText(t&&t.value);break}
  }
});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.dataset.w&&S.session){S.session.items[S.session.idx].w=r2(Math.max(0,num(t.value)));save()}
  else if(t.dataset.set==='goalKg'){S.settings.goalKg=r2(Math.max(0,num(t.value)));save()}});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='file'&&t.files&&t.files[0]){const f=t.files[0];t.value='';f.text().then(importText,()=>toast('Die Datei ließ sich nicht lesen.'))}});
document.addEventListener('keydown',ev=>{if(ev.key!=='Enter')return;const t=ev.target;if(t.id==='bw'){ev.preventDefault();const b=document.querySelector('[data-act="bw"]');if(b)b.click()}else if(t.dataset&&t.dataset.w)t.blur()});
document.addEventListener('focusin',ev=>{if(ev.target.id==='bt')ev.target.select()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const had=!!S.session;checkStale();if(had&&!S.session)render();wake();tick()}});

/* Start */
if(!S.plan||S.plan.ver!==5)genPlan();
checkStale();
if(S.session){wake();if(S.session.rest&&S.session.rest.endAt>Date.now()-4000)showRest();else if(S.session.rest){S.session.rest=null;save()}}
render();
setInterval(tick,250);
if('serviceWorker'in navigator&&!PREVIEW&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
