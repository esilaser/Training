<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<!--PWA-->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<!--/PWA-->
<title>Training</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#F2F2F7;--card:#FFFFFF;--card2:#F2F2F7;--sheet:#F2F2F7;--scard:#FFFFFF;
  --label:#000000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29);--fill:rgba(120,120,128,.2);--fill2:rgba(120,120,128,.16);--fill3:rgba(118,118,128,.12);--hl:#D1D1D6;
  --tint:#007AFF;--tint-soft:rgba(0,122,255,.12);--tint-mid:rgba(0,122,255,.42);--on:#FFFFFF;
  --red:#FF3B30;--green:#34C759;--orange:#FF9500;--yellow:#FFCC00;--pink:#FF2D55;--purple:#AF52DE;--indigo:#5856D6;--teal:#30B0C7;--cyan:#32ADE6;--gray:#8E8E93;
  --r1a:#E8003D;--r1b:#FA114F;--r2a:#4DBB00;--r2b:#86DD0E;--r3a:#00A2C2;--r3b:#00CFE0;--rt:.2;
  --mat:rgba(250,250,252,.74);--mat-line:rgba(0,0,0,.1);--shadow:0 10px 30px rgba(0,0,0,.12);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',system-ui,'Segoe UI',Roboto,sans-serif;
  --round:ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --spring:cubic-bezier(.32,.72,0,1);--bounce:cubic-bezier(.34,1.56,.64,1);
  --rad:20px;--segsel:#FFFFFF;
  --t1:#E8003D;--t2:#3C9A00;--t3:#0093B4;
}
@supports (transition-timing-function:linear(0,1)){:root{
  --spring:linear(0,0.0307,0.1066,0.2081,0.3206,0.4339,0.5413,0.6386,0.7237,0.7957,0.8551,0.9026,0.9396,0.9675,0.9878,1.002,1.0112,1.0166,1.0193,1.0199,1.0192,1.0176,1.0156,1.0133,1.0111,1.0089,1.007,1.0054,1.0039,1.0028,1);
  --bounce:linear(0,0.0433,0.1538,0.3044,0.4721,0.6385,0.7902,0.9186,1.0194,1.0918,1.1372,1.1592,1.1622,1.1511,1.1305,1.1046,1.0771,1.0505,1.0269,1.0074,0.9925,0.9822,0.9761,0.9736,0.9739,0.9763,0.98,0.9844,0.9889,0.9931,0.9967,0.9997,1.0019,1.0033,1.0041,1.0043,1.0042,1.0037,1.003,1.0023,1);
}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--card:#1C1C1E;--card2:#2C2C2E;--sheet:#1C1C1E;--scard:#2C2C2E;
  --label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65);--fill:rgba(120,120,128,.36);--fill2:rgba(120,120,128,.32);--fill3:rgba(118,118,128,.24);--hl:#3A3A3C;
  --tint:#0A84FF;--tint-soft:rgba(10,132,255,.22);--tint-mid:rgba(10,132,255,.5);
  --red:#FF453A;--green:#30D158;--orange:#FF9F0A;--yellow:#FFD60A;--pink:#FF375F;--purple:#BF5AF2;--indigo:#5E5CE6;--teal:#40C8E0;--cyan:#64D2FF;
  --r1a:#E1003F;--r1b:#FF2A68;--r2a:#7FE000;--r2b:#B8FF2E;--r3a:#00C8F0;--r3b:#2AF5E8;--rt:.24;
  --mat:rgba(30,30,32,.72);--mat-line:rgba(255,255,255,.12);--shadow:0 10px 30px rgba(0,0,0,.5);--segsel:#636366;--t1:#FF2A68;--t2:#B8FF2E;--t3:#2AF5E8;
}}
:root[data-theme="dark"]{
  --bg:#000000;--card:#1C1C1E;--card2:#2C2C2E;--sheet:#1C1C1E;--scard:#2C2C2E;
  --label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65);--fill:rgba(120,120,128,.36);--fill2:rgba(120,120,128,.32);--fill3:rgba(118,118,128,.24);--hl:#3A3A3C;
  --tint:#0A84FF;--tint-soft:rgba(10,132,255,.22);--tint-mid:rgba(10,132,255,.5);
  --red:#FF453A;--green:#30D158;--orange:#FF9F0A;--yellow:#FFD60A;--pink:#FF375F;--purple:#BF5AF2;--indigo:#5E5CE6;--teal:#40C8E0;--cyan:#64D2FF;
  --r1a:#E1003F;--r1b:#FF2A68;--r2a:#7FE000;--r2b:#B8FF2E;--r3a:#00C8F0;--r3b:#2AF5E8;--rt:.24;
  --mat:rgba(30,30,32,.72);--mat-line:rgba(255,255,255,.12);--shadow:0 10px 30px rgba(0,0,0,.5);--segsel:#636366;--t1:#FF2A68;--t2:#B8FF2E;--t3:#2AF5E8;
}
html{height:100%;background:var(--bg);touch-action:manipulation;-webkit-text-size-adjust:100%;scroll-padding-top:60px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--label);font:17px/1.35 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
main{max-width:640px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(116px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.intrain main{padding-top:0;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
body.intrain nav.tabs,body.intrain .nav,body.notabs nav.tabs{display:none}
body.notabs main{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
main.enter{animation:enter .45s var(--spring) both}
main.push{animation:push .5s var(--spring) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes push{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
h1,h2,h3{margin:0}
h1{font:700 34px/41px var(--font);letter-spacing:.01em}
h2{font:700 22px/28px var(--font)}
h3{font:600 17px/22px var(--font)}
p{margin:0}
.muted{color:var(--label2)}
.small{font-size:15px;line-height:20px}
.num{font-family:var(--round);font-weight:600;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.35;cursor:default}
:focus{outline:none}
:focus-visible{outline:3px solid var(--tint-soft);outline-offset:2px}
.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

/* Großer Titel und kompakte Kopfzeile */
.lth{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 16px;min-height:44px}
.lt{transform-origin:0 100%;will-change:transform}
.eyebrow{font:600 13px/18px var(--font);text-transform:uppercase;letter-spacing:.02em;color:var(--label2)}
.nav{position:fixed;top:0;left:0;right:0;z-index:30;height:calc(44px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:center;pointer-events:none;background:transparent;transition:background-color .25s,box-shadow .25s}
.nav b{font:600 17px/22px var(--font);opacity:0;transform:translateY(6px);transition:opacity .2s,transform .4s var(--spring)}
.nav.on{pointer-events:auto;background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--mat-line)}
.nav.on b{opacity:1;transform:none}
.who{width:44px;height:44px;border-radius:50%;border:0;padding:0;flex:none;background:linear-gradient(180deg,#A5ABB8,#858A96);color:#fff;font:600 19px var(--round);display:grid;place-items:center}

/* Karten, Listen, Abschnitte */
.sh{margin:28px 4px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sh span{font:400 15px var(--font);color:var(--label2)}
.card{background:var(--card);border-radius:var(--rad);padding:16px;margin-bottom:12px}
.card>h2{font-size:20px;line-height:25px;margin-bottom:6px}
.ch{display:flex;align-items:center;gap:6px;font:600 15px/20px var(--font);color:var(--c,var(--tint));margin-bottom:6px}
.ch .i{width:18px;height:18px}
.ch span{margin-left:auto;color:var(--label3);font-weight:400}
.lh{display:flex;justify-content:space-between;gap:10px;font:400 13px/18px var(--font);text-transform:uppercase;letter-spacing:.02em;color:var(--label2);margin:22px 16px 7px}
.lh:first-child{margin-top:8px}
.lf{font:400 13px/18px var(--font);color:var(--label2);margin:7px 16px 0}
.list{background:var(--card);border-radius:var(--rad);overflow:hidden;margin:0 0 12px}
.list+.lf,.card+.lf{margin-top:-5px}
.sh+.lh,.lth+.lh{margin-top:0}
.lh+.seg{margin-top:0}
.seg+.lf{margin-top:8px}
.cell{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 16px;border:0;background:transparent;text-align:left;color:var(--label);font:400 17px/22px var(--font);transition:background-color .35s}
.cell:active{background:var(--hl);transition:none}
div.cell:active{background:transparent}
.cell+.cell::before{content:'';position:absolute;top:0;right:0;left:var(--sx,16px);border-top:.5px solid var(--sep)}
.list.ic .cell{--sx:58px}
.cell .ct{flex:1;min-width:0}
.cell .ct b{display:block;font-weight:400}
.cell .ct small{display:block;font-size:15px;line-height:20px;color:var(--label2);margin-top:1px}
.cell .cv{color:var(--label2);text-align:right;flex:none}
.cell .chev{width:14px;height:14px;color:var(--label3);stroke-width:2.6}
.cell .ck{color:var(--tint);stroke-width:2.6;width:20px;height:20px}
.cell.danger,.cell.danger .ct b{color:var(--red)}
.cell.tint .ct b{color:var(--tint)}
.ico{width:30px;height:30px;border-radius:8px;background:var(--c,var(--tint));color:#fff;display:grid;place-items:center;flex:none}
.ico .i{width:19px;height:19px;stroke-width:2.2}

/* iOS-Schalter */
.sw{position:relative;flex:none;width:51px;height:31px;border-radius:16px;background:var(--fill);transition:background-color .3s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .5s var(--spring)}
[aria-checked="true"]>.sw{background:var(--green)}
[aria-checked="true"]>.sw::after{transform:translateX(20px)}

/* Segmente */
.seg{position:relative;display:flex;background:var(--fill3);border-radius:999px;padding:3px;margin:14px 0 4px;isolation:isolate}
.seg>i{position:absolute;z-index:-1;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));transform:translateX(calc(100% * var(--i)));border-radius:999px;background:var(--segsel);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .5s var(--spring)}
.list .seg,.card .seg{background:var(--fill3)}
.seg button{flex:1;min-width:0;border:0;background:none;border-radius:999px;padding:6px 4px;min-height:44px;font:500 15px/20px var(--font);color:var(--label);white-space:nowrap;transition:transform .3s var(--spring)}
.seg button[aria-pressed="true"]{font-weight:600}
.seg button:active{transform:scale(.95)}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 17px/22px var(--font);border:0;border-radius:999px;padding:12px 20px;min-height:50px;transition:transform .45s var(--spring),opacity .2s,background-color .2s}
.btn .i{width:20px;height:20px}
.btn:active{transform:scale(.96);transition-duration:.12s}
.btn.big{width:100%;min-height:54px;margin-top:16px}
.primary{background:var(--tint);color:var(--on)}
.ghost{background:var(--fill3);color:var(--tint)}
.ghost.plain{color:var(--label)}
.wide{width:100%;margin-top:12px}
.link{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:10px 0;min-height:44px;font:400 17px/22px var(--font);color:var(--tint);text-align:left;transition:opacity .2s}
.link:active{opacity:.4;transition:none}
.link.danger{color:var(--red)}
.center{display:flex;justify-content:center;width:100%;margin:6px auto 0;text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.btn{flex:1;white-space:nowrap;padding-left:12px;padding-right:12px}
.between{justify-content:space-between}
.btn.sm{padding:8px 4px;min-width:0;min-height:44px;font-size:16px}
.tip{font-size:13px;line-height:18px;color:var(--label2);margin-top:12px}
.note-card{display:flex;gap:12px;align-items:flex-start}
.note-card>.i{width:24px;height:24px;color:var(--c,var(--tint));margin-top:1px}
.note-card .btn{margin-top:12px}
.note-card h2{font-size:20px;line-height:25px;margin-bottom:3px}
.note-card .ct{flex:1;min-width:0}

/* Ringe wie bei Apple Fitness */
.wkr{display:flex;align-items:center;gap:18px}
.rings{width:124px;height:124px;flex:none;display:block}
.rings circle{fill:none;stroke-linecap:round}
.rings .tr{stroke-opacity:var(--rt)}
.rings .pg{transition:stroke-dashoffset 1.1s var(--spring)}
.leg{flex:1;min-width:0;display:grid;gap:6px}
.leg p{line-height:1.15}
.leg span{display:block;font:600 15px/20px var(--font);color:var(--c)}
.leg b{font:600 24px/28px var(--round);color:var(--c);font-variant-numeric:tabular-nums}
.leg b small{font-size:17px;font-weight:600;opacity:.9}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:16px;padding-top:12px;border-top:.5px solid var(--sep)}
.week div{display:flex;flex-direction:column;align-items:center;gap:5px;font:500 12px/16px var(--font);color:var(--label2)}
.week .td{color:var(--label);font-weight:700}
.week svg{width:30px;height:30px;display:block}
.week circle{fill:none;stroke-linecap:round}

/* Wochenstreifen ohne Ringe */
.strip{display:none}

/* Heute */
.hero h2{font-size:28px;line-height:34px;margin-top:2px}
.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--label2);font-size:15px;margin-top:6px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta .i{width:17px;height:17px}
.xrow{gap:12px;padding:8px 14px 8px 12px;min-height:60px}
.list .xrow{--sx:88px}
.fig.th{width:64px;height:48px;background:var(--card2);border-radius:12px;flex:none}
.bar{display:block;height:8px;border-radius:4px;background:var(--fill3);overflow:hidden;margin-top:8px}
.bar b{display:block;height:100%;border-radius:4px;background:var(--c,var(--tint));transition:width .8s var(--spring)}
.bmap{display:flex;justify-content:center;gap:8px;margin:2px 0 0}
.bmap figure{margin:0;flex:1;max-width:150px;text-align:center}
.bmap svg{width:100%;height:auto;display:block}
.bmap figcaption{font:500 13px/18px var(--font);color:var(--label2);margin-top:4px}
.bmap .bs{fill:var(--fill2)}
.bmap [data-g]{stroke:var(--card);stroke-width:1;stroke-linejoin:round;cursor:pointer;transition:fill .5s}
.bmap .sep{stroke:var(--card);stroke-width:1;fill:none}
.mleg{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font:500 13px/18px var(--font);color:var(--label2);margin-top:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;vertical-align:-1px;margin-right:5px}
.mrow .dot{width:12px;height:12px;margin:0}
.mrow .ct .bar{margin-top:6px;height:6px}
.msum{font-size:15px;line-height:20px;margin-top:12px;text-align:center;color:var(--label2)}
.stats .dot{width:8px;height:8px;margin-right:4px}
.weigh{position:relative}
.weigh .ch{padding-right:30px}
.wx{position:absolute;top:4px;right:4px;width:44px;height:44px;border:0;background:none;color:var(--label3);display:grid;place-items:center;padding:0;flex:none}
.wx .i{width:15px;height:15px;stroke-width:2.6}
.weigh .inrow{margin-top:8px}
.undo{display:flex;align-items:center;justify-content:center;gap:6px;margin:0 auto 12px;min-height:44px;padding:8px 18px;border:0;border-radius:999px;background:var(--fill3);color:var(--tint);font:600 15px/20px var(--font);animation:enter .4s var(--spring) both}
.undo .i{width:17px;height:17px}
.rover .undo{margin-top:-8px}
.rover.go .undo{background:rgba(255,255,255,.22);color:#fff}
.tools{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px;margin-top:14px}
.tools button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:60px;padding:8px 4px;border:0;border-radius:16px;background:var(--card);color:var(--tint);font:500 13px/16px var(--font);transition:transform .45s var(--spring)}
.tools button:active{transform:scale(.94);transition-duration:.12s}
.tools .i{width:22px;height:22px}
.gearrow{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;min-height:44px;padding:10px 14px;border:0;border-radius:14px;background:var(--tint-soft);color:var(--tint);font:600 15px/20px var(--font);text-align:left}
.gearrow span{flex:1;color:var(--label)}
.gearrow small{font:500 13px var(--font)}
.gearrow .i{width:20px;height:20px}
label.cell:active{background:transparent}
.field.sm2{width:140px;min-height:44px;text-align:right;padding:8px 12px}
.coach{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border-radius:14px;padding:12px;margin-top:12px;font-size:15px;line-height:20px}
.coach .i{color:var(--c);width:20px;height:20px;margin-top:1px}
.rvl p{margin-top:10px;font-size:15px;line-height:20px;color:var(--label2)}
.rvl b{display:block;color:var(--label);font-weight:600}
.burst span{font:700 20px/24px var(--font)}
.burst small{font:500 13px/17px var(--font);color:var(--label2);padding:0 12px;text-align:center}
.burst.rec{width:230px;height:190px;margin:-95px 0 0 -115px;animation-duration:1.9s}
.burst.rec .i{color:var(--orange);stroke-dasharray:none;stroke-dashoffset:0;animation:pop .7s var(--bounce)}
.confetti i{position:fixed;left:50%;top:46%;z-index:61;width:8px;height:13px;border-radius:2px;pointer-events:none;animation:conf 1.5s cubic-bezier(.15,.75,.3,1) both}
@keyframes conf{0%{transform:translate(-50%,-50%) rotate(0);opacity:1}80%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r));opacity:0}}
.note.warn{color:var(--orange)}

/* Strichfiguren */
.fig{display:block;width:100%;height:auto}
.fig path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .gr{stroke:var(--sep);stroke-width:2}
.fig .pr{stroke:var(--label2);stroke-width:4;opacity:.35}
.fig .cb{stroke:var(--label2);stroke-width:1.6}
.fig .lf,.fig .af{stroke:var(--label);stroke-width:6}
.fig .tn{stroke:var(--label);stroke-width:9}
.fig .hd{fill:var(--label)}
.fig .ln{stroke:var(--label);stroke-width:7}
.fig .an{stroke:var(--label);stroke-width:6}
.fig .eq{stroke:var(--tint);stroke-width:4}
.fig .eqf{fill:var(--tint)}
.fig .eqr{fill:none;stroke:var(--tint);stroke-width:4}
.fig.big{max-width:320px;margin:0 auto 14px;background:var(--scard);border-radius:22px}

/* Plan */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.daysc{padding:10px 8px}
.days button{border:0;background:var(--fill3);color:var(--label);border-radius:14px;min-height:60px;padding:6px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 15px/20px var(--font);transition:transform .45s var(--spring),background-color .25s,color .25s}
.days button:active{transform:scale(.92);transition-duration:.12s}
.days button small{font-size:11px;line-height:13px;font-weight:500;color:var(--label2)}
.days button.g{background:var(--tint);color:#fff}
.days button.g small{color:rgba(255,255,255,.85)}

  const by={};all.filter(h=>!h.dl&&h.form!=='muede').forEach(h=>h.items.forEach(i=>{if(i.t!=='r'||!i.sets.length)return;const v=Math.max(...i.sets.map(s=>s.w>0?e1(s.w,s.v):s.v));(by[i.id||i.name]=by[i.id||i.name]||[]).push(v)}));

/* Noch eine Übung: zuerst Übersprungenes nachholen, dann Muskeln, die diese Woche zu kurz kamen */
function extraSugg(){
  const s=S.session,inS=new Set(s.items.map(q=>q.id)),T=targets(),D=doneVol().v,out=[];
  s.items.forEach(q=>{const e=EXM[q.id];if(!e||q.id==='warm'||e.g==='ca')return;const n=q.sets.filter(x=>x.done).length;if(D[e.g]!=null)D[e.g]+=n;e.sec.forEach(g=>{if(D[g]!=null)D[g]+=n/2})});
  for(const g of GORD.filter(g=>T[g]>0).sort((a,b)=>D[a]/T[a]-D[b]/T[b])){if(out.length>=3)break;const c=EX.filter(x=>x.g===g&&x.t==='r'&&avail(x,s.pl)&&!inS.has(x.id)&&!(S.setup.ban||[]).includes(x.id)).sort((a,b)=>(a.c-b.c)||a.i-b.i);if(c[0])out.push([c[0],g,D[g]/T[g]])}
  return out;
}
function moreBlock(){
  const s=S.session,sk=s.items.map((q,i)=>[q,i]).filter(([q])=>q.skip&&q.sets.some(x=>!x.done)),sg=extraSugg();

    case'sheetclose':closeSheet();break;
    case'setdone':completeSet();break;
    case'vadj':{const it=s.items[s.idx],st=it.sets.find(x=>!x.done);if(!st)break;const d=it.t==='t'?(st.v>=300?60:5):1;st.v=Math.max(it.t==='t'?5:0,st.v+(+v)*d);save();render();break}
    case'wadj':{const it=s.items[s.idx];it.w=r2(Math.max(0,it.w+(+v)*(it.step||2.5)));save();render();break}
    case'tgo':{const st=s.items[s.idx].sets.find(x=>!x.done);if(st){s.run={i:s.idx,endAt:Date.now()+st.v*1000,total:st.v};save();render()}break}
    case'tstop':if(s.run){const el=Math.max(1,Math.round(s.run.total-(s.run.endAt-Date.now())/1000));completeSet(Math.min(el,s.run.total))}break;
    case'skip':{s.items[s.idx].skip=true;s.run=null;const nx=nextIdx(s);if(nx<0){save();openFinish()}else{s.idx=nx;save();render()}break}
    case'overview':overviewSheet();break;
    case'extra':addExtra(id);break;
    case'extralist':extraSheet();break;
    case'jump':{const i=+b.dataset.i;if(s.items[i]){s.items[i].skip=false;s.idx=i;s.run=null}closeSheet();save();render();window.scrollTo(0,0);break}
    case'end':openFinish();break;
    case'finish':{const ok=finalize(false);kick();tab='heute';window.scrollTo(0,0);render('enter');toast(ok?'Gespeichert, stark gemacht!':'Training beendet.');break}
    case'discard':if(was==='discard'){armed=null;undoSnap=null;hideRest();closeSheet();S.session=null;save();sleep();render()}else{armed='discard';openFinish()}break;
    case'radj':{const r=s&&s.rest;if(r){r.endAt=(+v>0?Math.max(r.endAt,Date.now()):r.endAt)+(+v)*1000;r.total=Math.max(r.total,(r.endAt-Date.now())/1000);r.fired=false;save();document.getElementById('rest').classList.remove('go');const t=document.getElementById('rtitle');if(t)t.textContent='Pause';tick()}break}
    case'rskip':hideRest();break;
    case'bw':{const inp=document.getElementById('bw'),x=num(inp&&inp.value);if(x<30||x>300){toast('Trag dein Gewicht in kg ein, z. B. 68,5');break}const d=ymd(Date.now());S.body=S.body.filter(q=>q.d!==d);S.body.push({d,kg:r2(x)});save();kick();render();toast('Eingetragen');break}
    case'bwdel':if(was==='bwdel'){const B=[...S.body].sort((p,q)=>p.d<q.d?-1:1),l=B[B.length-1];S.body=S.body.filter(q=>q!==l);armed=null;save()}else armed='bwdel';render();break;
    case'htoggle':openHist.has(id)?openHist.delete(id):openHist.add(id);render();break;
    case'delhist':if(was==='h'+id){(S.del=S.del||[]).push(id);S.history=S.history.filter(h=>h.id!==id);armed=null;save();kick()}else armed='h'+id;render();break;
    case'showall':showAll=!showAll;render();break;
    case'backup':exportBackup();break;
    case'restore':{const f=document.getElementById('file');if(f)f.click();break}
    case'copybt':{const t=document.getElementById('bt');if(!t)break;t.focus();t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(backupText).then(()=>toast('Kopiert'),()=>toast(ok?'Kopiert':'Text ist markiert, jetzt kopieren'));else toast(ok?'Kopiert':'Text ist markiert, jetzt kopieren');break}
    case'pastetoggle':pasteOpen=!pasteOpen;render();break;
    case'pasteload':{const t=document.getElementById('pt');importText(t&&t.value);break}
  }
}
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.dataset.ob){OB[t.dataset.ob]=t.value;return}
  if(t.dataset.w&&S.session){S.session.items[S.session.idx].w=r2(Math.max(0,num(t.value)));save()}
  else if(t.dataset.set==='goalKg'){S.settings.goalKg=r2(Math.max(0,num(t.value)));save()}});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='file'&&t.files&&t.files[0]){const f=t.files[0];t.value='';f.text().then(importText,()=>toast('Die Datei ließ sich nicht lesen.'))}});
document.addEventListener('keydown',ev=>{if(ev.key!=='Enter')return;const t=ev.target;if(t.id==='bw'||t.id==='wq'){ev.preventDefault();const b=document.querySelector(`[data-act="${t.id==='bw'?'bw':'weigh'}"]`);if(b)b.click()}else if(t.dataset&&t.dataset.w)t.blur()});
document.addEventListener('focusin',ev=>{if(ev.target.id==='bt')ev.target.select()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const had=!!S.session;checkStale();if(!S.session&&!S.onb&&S.plan&&S.plan.wk!==ymd(monday(Date.now()))){ensureWeek();genPlan();render()}else if(had&&!S.session)render();wake();tick();if(S.cloud&&Date.now()-(S.cloud.last||0)>120000)sync()}});

/* Start */
inviteFromUrl();
ensureWeek();
if(!S.plan||S.plan.ver!==6||S.plan.wk!==ymd(monday(Date.now())))genPlan();
setTimeout(()=>sync(),1500);
setTimeout(inviteCheck,1800);
checkStale();
if(S.session){wake();if(S.session.rest&&S.session.rest.endAt>Date.now()-4000)showRest();else if(S.session.rest){S.session.rest=null;save()}}
render();
setInterval(tick,250);
if('serviceWorker'in navigator&&!PREVIEW&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
